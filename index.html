    <h2 id="augTitolo"></h2>
    <p id="augTesto"></p>
  </section>
</main>

<footer>Fatto con affetto, all'ombra del Vesuvio.</footer>
<canvas id="coriandoli"></canvas>

<script src="contenuti.js"></script>
<script>
(function () {
  var C = CONTENUTI;
  var $ = function (id) { return document.getElementById(id); };

  // Testi
  $("kicker").textContent = C.kicker;
  $("titolo").textContent = C.titolo;
  $("sottotitolo").textContent = C.sottotitolo;
  $("augTitolo").textContent = C.auguri.titolo;
  $("augTesto").textContent = C.auguri.testo;

  // Spazio per lo stemma: se images/stemma.png esiste, sostituisce il segnaposto
  var img = $("stemmaImg"), ph = $("stemmaPh");
  var box = img.parentNode;
  function stemmaOk() { ph.style.display = "none"; img.style.display = ""; box.classList.add("con-stemma"); }
  function stemmaKo() { img.style.display = "none"; ph.style.display = ""; box.classList.remove("con-stemma"); }
  img.addEventListener("load", stemmaOk);
  img.addEventListener("error", stemmaKo);
  if (img.complete) { img.naturalWidth > 0 ? stemmaOk() : stemmaKo(); }

  // Countdown
  var target = new Date(C.data.anno, C.data.mese - 1, C.data.giorno, 0, 0, 0).getTime();
  var finito = false;
  function pad(n) { return String(n).padStart(2, "0"); }
  function tick() {
    var diff = target - Date.now();
    if (diff <= 0) {
      if (!finito) { finito = true; mostraAuguri(); }
      $("g").textContent = $("o").textContent = $("m").textContent = $("s").textContent = "00";
      return;
    }
    var s = Math.floor(diff / 1000);
    $("g").textContent = Math.floor(s / 86400);
    $("o").textContent = pad(Math.floor(s % 86400 / 3600));
    $("m").textContent = pad(Math.floor(s % 3600 / 60));
    $("s").textContent = pad(s % 60);
  }
  tick(); setInterval(tick, 1000);

  // Frasi simpatiche
  var ultima = -1;
  function nuovaFrase() {
    var i;
    do { i = Math.floor(Math.random() * C.frasi.length); } while (i === ultima && C.frasi.length > 1);
    ultima = i;
    $("frase").textContent = C.frasi[i];
  }
  nuovaFrase();
  $("btnFrase").addEventListener("click", nuovaFrase);

  // Cornetto
  $("btnCornetto").addEventListener("click", function () {
    $("frase").textContent = C.cornetto;
    coriandoli(90);
  });

  // Tombola con smorfia
  var numeri = Object.keys(C.smorfia).map(Number), estratti = [];
  $("btnTombola").addEventListener("click", function () {
    if (estratti.length === numeri.length) estratti = [];
    var libero = numeri.filter(function (n) { return estratti.indexOf(n) < 0; });
    var n = libero[Math.floor(Math.random() * libero.length)];
    estratti.push(n);
    $("tombola").classList.remove("hidden");
    $("num").textContent = n;
    $("sig").textContent = C.smorfia[n];
    $("storico").innerHTML = "";
    estratti.forEach(function (x) {
      var i = document.createElement("i"); i.textContent = x; $("storico").appendChild(i);
    });
  });

  // Auguri
  function mostraAuguri() {
    $("auguri").classList.remove("hidden");
    coriandoli(160);
    $("auguri").scrollIntoView({ behavior: "smooth", block: "center" });
  }
  $("btnAuguri").addEventListener("click", mostraAuguri);

  // Coriandoli (canvas, nessuna libreria)
  var cv = $("coriandoli"), cx = cv.getContext("2d"), parts = [], run = false;
  var colori = ["#12a0d7", "#f4c542", "#ffffff", "#7fd6f5"];
  function resize() { cv.width = innerWidth; cv.height = innerHeight; }
  addEventListener("resize", resize); resize();
  function coriandoli(n) {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    for (var i = 0; i < n; i++) {
      parts.push({
        x: cv.width / 2, y: cv.height / 3,
        vx: (Math.random() - .5) * 14, vy: Math.random() * -11 - 3,
        r: Math.random() * 6 + 3, c: colori[i % colori.length],
        rot: Math.random() * 6, vr: (Math.random() - .5) * .4, vita: 140 + Math.random() * 60
      });
    }
    if (!run) { run = true; requestAnimationFrame(frame); }
  }
  function frame() {
    cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(function (p) { return p.vita > 0 && p.y < cv.height + 20; });
    parts.forEach(function (p) {
      p.vy += .28; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vita--;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.fillStyle = p.c; cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); cx.restore();
    });
    if (parts.length) requestAnimationFrame(frame); else { run = false; cx.clearRect(0, 0, cv.width, cv.height); }
  }
})();
</script>
</body>
</html>
